# ============================================================
# 统一配置入口（本文件只负责 profile 切换，具体配置见各 profile 文件）
#
#   application-demo.yaml  演示环境（远端模板，占位符配置，随仓库提交）
#   application-dev.yaml   本地开发环境（真实凭据，永不提交，已被 .gitignore 排除）
#
# 切换方式（优先级从高到低）：
#   1. 命令行:  java -jar app.jar --spring.profiles.active=demo
#   2. 环境变量: SPRING_PROFILES_ACTIVE=demo
#   3. 缺省值:  dev（下方占位符默认值）
#
# 依据 Spring Boot 3.0 配置数据机制：application.yaml 先加载，
# 随后自动叠加 application-{profile}.yaml 中的同名键覆盖
# ============================================================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
